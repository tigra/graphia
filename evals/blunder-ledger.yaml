d 6/18 against an 11/24 baseline with Wilson intervals overlapping heavily, and decisively by the fact that an enforced call could not produce end_turn at all. So a model handed the deliberately open DIARY_SYSTEM answered in PROSE (stop_reason=end_turn, no tool call) and _ai_diary threw the entry away. RULED OUT by measurement, in order: prompt growth (fallbacks are flat -- 50% on Day 1, 51% on Day 2, and Day 1 carries the smallest prompt); the 1024-token output cap (real output ran 155-693 tokens with ZERO truncations, and raising the cap to 4096 did not help); context overflow (32768 loaded against ~3.4k prompts); model drift (identical digest 06c1097efce0); and server contention (the two ollama arms ran sequentially, 14:19 then 15:58). Replaying six real captured prompts reproduced it at 11/24 = 46%, matching this arm, and 11 of 11 prose replies carried a complete in-voice entry in raw.content. The control is decisive: spec 028 thoughts on the SAME model in the SAME runs failed 0 of 391, because REFLECTION_SYSTEM asks for a terse one-or-two-sentence note where DIARY_SYSTEM invites free-form writing. Bedrock is clean because Converse enforces its toolConfig. FIXED by recovering the prose from the reply: the same 24 calls now fall back 0 times. THIS ARM IS SUPERSEDED -- rerun on the fix and read the later record instead.'
