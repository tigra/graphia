notes: 'Spec 041 Slice 4 (The Interim Recovery Is Withdrawn) Task 4.4 -- LIVE WITHDRAWAL VERIFICATION at n=1. NOT a baseline and NOT a behaviour measurement: read no rate in metrics or outcomes here as a result. WHY THIS RECORD IS DECISIVE WHERE THE SLICE 2 RECORD WAS NOT. Slice 4 withdrew the interim application-layer prose recovery (ADR 013 Alternative 1, shipped at commit b9bfbd4): _DIARY_LABEL_MAX, _content_text, _recovered_diary_text and _diary_entry_from are gone from src/graphia/nodes/day.py, the diary call is a plain with_structured_output(Diary), and the now-unused import json is dropped. Exactly ONE mechanism can now produce a readable diary entry -- grammar-constrained decoding on native ChatOllama over /api/chat under a JSON-schema format. The Slice 2 record (2026-09-04, transcript_dir 2026-09-04T17-10-11) measured this same channel at diary_fallback_rate 0.00 over 13 entries and recorded in its own note the bound it could not exceed: the recovery was STILL PRESENT at that commit, so a clean rate there could not distinguish grammar-constrained decoding from prose recovery, and what actually separated them was the paired transport measurement (Diary 18 invocations, 0 classification failures). That bound is now lifted. With no second mechanism left to credit, the game-level rate is decisive on its own, and THIS RECORD SUPERSEDES THE SLICE 2 RECORD ON THAT POINT ONLY -- not as a transport measurement and not as a record, both of which stand. THE ASSERTION, never read without its denominator: quality.diary_fallback_rate == 0.00 READ BESIDE quality.diary_entries_attempted, because a 0.00 rate over a zero denominator is also 0.00 and would prove nothing; the fallback check is EXACT STRING EQUALITY against graphia.nodes.day._DIARY_FALLBACK, never a substring grep, and the denominator is reconciled against this game own attrition (who died on which Night, who was executed on which Day, how many AI writers survived into each diary round) -- see the POST-RUN EXTENSION appended below. CONFIRMATORY TRANSPORT MEASUREMENT, same server (Ollama 0.32.14) and same model pair, taken immediately BEFORE this run: make ollama-smoke at --max-rounds 7 reported Diary 6 attempts / 0 classification failures / 0.00 failure rate, with Reflection 35/0, DayAction 41/0, Pointing 4/0 and Roster 1/0 all clean and Ballot not exercised (0 attempts); verdict RELIABLE, game completed, stopped at the 7-round sampling cap. It is CONFIRMATORY rather than necessary this time, which is precisely the difference from Slice 2, where it carried the separating weight. Two known instrument gaps that Slice 11 (Task 11.1) owns were reproduced by that run and are not findings of this one: the PRINTED per-schema table lists only four schemas while the JSON report carries six, and Persona never appears at all (zero attempts, absent from the stats map). LINEUP: played at six-and-two (settings.lineup num_citizens 6 / num_mafia 2), the CR 007 / spec 042 default since 2026-09-03. NOT comparable across the lineup boundary: the larger table affords the town ONE mistaken execution where five-and-two afforded none, and nearly every denominator here scales with table size (21 persona pairs against 15, more AI spoken lines, more votes). Read settings.lineup on each record and never its date -- four records from 2026-06-21/22 were already played at six-and-two by explicit override. The directly comparable predecessor is the Slice 2 record named above, same lineup and same provider, one generation earlier in transport. At n=1 no METRIC_ORDER rate is usable -- denominators run single-digit to low-double-digit and no decrease of any size is detectable -- so per CR 005 this is recorded as effort, not result; the measured A/B that IS a result is Task 12.2, 10 games per arm. POST-RUN EXTENSION (Task 4.4, appended by hand after the run; notes is the one human-mutable field per evals/README.md, and nothing else in this record was touched). DENOMINATOR RECONCILED -- the binding half of the assertion. quality.diary_entries_attempted is 18 and it reconciles exactly against this game''s own attrition. Eight seats (6+2); the scripted human seat is Avery (Law-abiding, human="true" in the preserved transcript) and Avery was the Night 1 kill, so from Day 1 onward every survivor was an AI writer. Night 1 killed Avery, leaving 7 alive -- Day 1 diary, 7 writers (Kai, Liam, Hao, Rio, Zoe, Leo, Lay). Night 2 killed Liam, leaving 6 -- Day 2 diary, 6 writers. Night 3 killed Leo, leaving 5 -- Day 3 diary, 5 writers. Night 4 killed Rio, leaving 2 Law-abiding against 2 Mafiosos, which is parity and the Mafia win, so there is no Day 4 and no fourth diary round. 7+6+5 = 18, matching the recorded denominator exactly. The two structural boundaries documented on day_diary hold: Night 1 carries no diary (the graph enters night_open from first_night_mafia_intros) and the winning transition carries none. INDEPENDENT CROSS-CHECK on the preserved transcript: 18 <diary> elements, and ZERO equal to graphia.nodes.day._DIARY_FALLBACK by EXACT STRING EQUALITY -- eval_transcript._inline_attr emits diary content verbatim with no escaping, so the byte comparison is valid -- with the closest any entry comes to the placeholder at difflib 0.160. That agrees with the record''s own sentinel scorer (diary_fallback_entries 0 of 18), which reads the private_diaries state channel rather than the file. ENGAGEMENT WARNING, READ THIS BESIDE THE CLEAN DIARY RATE. This game is a near-total AI non-engagement case and a reader who takes only the 0.00 away will misread it. vote_activity.by_side is law_abiding 0 / mafia 0 with by_day empty: the AI town initiated NOT ONE execution vote across three full Days, every Day ran its whole round schedule to midnight with "No one has been executed today", and all four deaths were Night kills. Consequently self_vote.initiation, self_vote.yes and peer_vote.yes are ABSENT from metrics rather than 0.00 -- correctly so, their denominators being zero -- and this record therefore carries only two behavioural rates (repetition 0.741 over 108 AI spoken lines; third_person_self_talk 0.00 over the same 108) beside the persona family. The Mafia win is attrition, not play. This does not weaken the diary assertion, whose denominator is driven by survival rather than by voting, but nothing in outcomes or vote_activity from this run is usable as behaviour. On metrics.repetition 0.741 specifically: the two committed n=20 six-and-two baselines read 0.634 and 0.637 and the Slice 2 single game read 0.714, so this is a noisy single game slightly above band, not a signal. SEMANTIC PERSONA METRICS ABSENT BY GRACEFUL DEGRADATION, NOT BY A ZERO. The spec-033 embeddings instrument failed with botocore UnauthorizedSSOTokenError (the SSO session on the profile had expired; the instrument is deliberately always Bedrock, independent of GRAPHIA_LLM_PROVIDER, so the measuring stick cannot move with the model under test). The harness logged the skip and the run completed, and persona_sem_mean / persona_sem_peak are OMITTED from metrics rather than written as 0.0 -- absent, never a misleading zero. The free lexical pair is unaffected (persona_lex_mean 0.024, persona_lex_peak 0.051 over 21 pairs), so the Slice 2 record''s persona_sem figures have no counterpart here and the two runs are not comparable on that pair. DIARY CONTENT FOLLOW-UP -- the open question Slice 2 left, re-measured here and deliberately NOT rounded to success. Same-writer consecutive-entry difflib over the 11 pairs this game affords: 2 at or above 0.85, namely Hao Day 2 to Day 3 at 0.891 and Leo Day 1 to Day 2 at 1.000, BYTE-IDENTICAL. Three generations, one game each: pre-swap transcript 2026-09-04T13-13-43, 6 pairs, 5 at or above 0.85, 4 byte-identical, median 1.000; Slice 2 transcript 2026-09-04T17-10-11, 8 pairs, 2 at or above 0.85, 0 byte-identical, median 0.199; this run, 11 pairs, 2 at or above 0.85, 1 byte-identical, median 0.513. The large improvement attributable to the transport swap stands. But the Slice 2 note''s claim that there were NONE exact after the swap was an n=1 observation rather than a property, and one exact repeat reappears here. Withdrawing the recovery cannot explain it: the recovery only ever supplied text when structured decoding failed, and it failed zero times in this run. So this remains the pre-existing, unmetered content defect it already was, at a much reduced level, and a follow-up-spec candidate. Two single games cannot separate 0 of 8 from 1 of 11 -- read neither as a trend. The diary channel still has NO repetition metric, so this observation lives only in these notes and in the preserved transcripts. VERDICT ON THE WITHDRAWAL: IT HOLDS. With the recovery removed there is exactly one mechanism able to produce a readable entry, and 18 of 18 entries are model-written prose with zero placeholders. Reliable decoding, not the recovery, was doing the work.'
