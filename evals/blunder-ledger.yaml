OT comparable across the lineup boundary: the larger table affords the town ONE mistaken execution where five-and-two afforded none, and nearly every denominator here scales with table size (21 persona pairs against 15, more AI spoken lines, more votes). Read settings.lineup on each record and never its date -- four records from 2026-06-21/22 were already played at six-and-two by explicit override. The directly comparable predecessor is the 2026-09-04 six-and-two one-game smoke, which measured the same channel under the interim recovery on the retired transport. CONTENT FINDING, recorded here because the diary channel has no repetition metric at all and this transcript is the only evidence: 2 of the 13 entries are near-verbatim self-rewrites by the same writer on consecutive days (difflib ratio 0.994 and 0.986, one noun swapped in each). These are model-written prose and not the fallback, so the assertion above is untouched. The transport swap markedly IMPROVED this rather than causing it -- on the pre-swap six-and-two transcript 2026-09-04T13-13-43, 7 of 9 same-writer pairs sit at or above 0.85 including four byte-identical repeats, where here it is 2 of 11 with none exact. Pre-existing, reduced, unmetered, and a follow-up candidate rather than a Slice 2 defect. ON metrics.repetition 0.714 SPECIFICALLY, which invites a false regression read next to the preceding smoke 0.091: not a regression signal. The two committed n=20 six-and-two baselines read 0.634 and 0.637 and the ollama series runs 0.29 to 0.64, so this is a noisy single game slightly above band, while the 0.091 was the outlier in the other direction over a 22-line denominator from a much shorter game. Neither figure is usable at n=1.'
